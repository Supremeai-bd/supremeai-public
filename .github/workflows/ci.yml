name: 'SupremeAI Unified CI (Web + Desktop + Tauri Android)'

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supremeai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: 'Web Studio Typecheck & Build'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js 24 (npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Lint (ESLint)
        shell: bash
        run: npm run lint

      - name: Run JavaScript Tests
        shell: bash
        run: npm test

      - name: Typecheck Cloudflare Edge Functions
        run: npm run typecheck:edge

      - name: Typecheck & Build Web Bundle
        shell: bash
        run: npm run build:web

  desktop-rust:
    name: 'Desktop Tauri v2 (Windows Rust + React UI)'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js 24 (npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> src-tauri/target'

      - name: Install dependencies & build shared app bundle
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build:app

      - name: Compile Rust Tauri backend
        shell: bash
        run: cargo build --manifest-path src-tauri/Cargo.toml

      - name: Rust unit tests
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Rust Clippy check
        shell: bash
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -W clippy::all

  android-tauri:
    name: 'Android Tauri v2 APK (Single-Source React UI + Rust)'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js 24 (npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup JDK 21 (Required by Tauri v2 Gradle 9 + AGP 9)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Pre-installed Android SDK, Licenses & NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK_DIR" ]; then
            echo "::error::Android SDK directory not found at $SDK_DIR"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"

          if [ -d "$SDK_DIR/cmdline-tools/latest/bin" ]; then
            echo "$SDK_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          fi

          if [ -n "${SDKMANAGER:-}" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            if [ ! -d "$SDK_DIR/platforms/android-37" ]; then
              "$SDKMANAGER" "platforms;android-37" || true
            fi
          fi

          NDK_DIR=$(ls -d "$SDK_DIR/ndk/"* 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$NDK_DIR" ]; then
            if [ -n "${SDKMANAGER:-}" ]; then
              "$SDKMANAGER" "ndk;27.0.12077973"
              NDK_DIR="$SDK_DIR/ndk/27.0.12077973"
            else
              echo "::error::Android NDK not found and sdkmanager unavailable"
              exit 1
            fi
          fi

          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "Using Java: $(java -version 2>&1 | head -n 1)"
          echo "Using Android SDK: $SDK_DIR"
          echo "Using Android NDK: $NDK_DIR"

      - name: Setup Rust toolchain (Android aarch64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> src-tauri/target'

      - name: Install dependencies & build shared app bundle
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build:app

      - name: Initialize Tauri Android target & compile Debug APK
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "src-tauri/gen/android" ]; then
            npm run tauri -- android init --ci --skip-targets-install
          fi
          chmod +x src-tauri/gen/android/gradlew 2>/dev/null || true
          npm run tauri -- android build --apk --debug --target aarch64 --ci

  vscode-extension:
    name: 'VS Code Extension (TypeScript + VSIX Tests)'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js 24 (npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Compile & Test packages/vscode-extension
        shell: bash
        run: |
          set -euo pipefail
          cd packages/vscode-extension
          npm install --no-audit --no-fund
          npm run compile
          npm test
