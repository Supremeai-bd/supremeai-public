name: 'SupremeAI Unified CI & Release Pipeline (Web + Desktop + Android + VSIX)'

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'functions/**'
      - 'public/**'
      - 'scripts/**'
      - 'tsconfig*.json'
      - 'vite*.config.ts'
      - '.npmrc'
      - 'packages/**'
      - 'src-tauri/**'
      - 'server.ts'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'version.json'
      - 'deploy/admin-redirect/**'
      # বাংলা মন্তব্য: শুধু Rule 10 patch merge হলেও reverse-sync job চালু হবে।
      - '.patches/private/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release Version Tag (leave empty for rolling 'latest' build)"
        required: false
        default: ''
      publish_release:
        description: 'Publish unified GitHub Release with Web + Desktop + Android artifacts'
        required: true
        type: boolean
        default: true
      draft:
        description: 'Create draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # বাংলা মন্তব্য: PR-এ নতুন কমিট এলে পুরোনো রান ক্যান্সেল হবে (সময় ও রানার বাঁচাতে),
  # কিন্তু main/tag পুশে চলমান রিলিজ/ডিপ্লয় কখনোই ক্যান্সেল হবে না।
  group: supremeai-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smart-pr-guard:
    name: '0/4 Smart Intelligent PR Guard (<15s)'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      risk_tier: ${{ steps.guard.outputs.risk_tier }}
      pr_guard_passed: ${{ steps.guard.outputs.pr_guard_passed }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Intelligent PR Guard Preflight
        id: guard
        shell: bash
        run: |
          node scripts/smart-pr-guard.mjs
          # বাংলা মন্তব্য: dependency ছাড়াই sync lifecycle regression বিদ্যমান gate-এ চলবে।
          python3 -m unittest discover -s scripts/ci -p 'test_*.py'

  build-web:
    name: '1/4 Build & Deploy Web Studio'
    needs: [smart-pr-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js 24 (npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Sync Version, Test & Build Web Bundle
        shell: bash
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        run: |
          set -euo pipefail
          npm ci
          npm run version:sync
          # বাংলা মন্তব্য: আগে `npm test` চলত কিন্তু কভারেজ কখনো মাপা হতো না, ফলে
          # vitest.config.ts-এর thresholds কখনো কার্যকর হয়নি (মিথ্যা নিরাপত্তা)।
          # এখন সত্যিকারের কভারেজ গেট — থ্রেশহোল্ডের নিচে নামলে CI লাল হবে।
          npm run test:coverage
          npm run typecheck:edge
          npm run build:web
          tar -czf supremeai-web-dist.tar.gz dist/
          # বাংলা মন্তব্য: wrangler-action ভেতর থেকে npx auto-install করতে গিয়ে non-interactive
          # runner-এ "npx canceled due to missing packages" ফেইল করেছিল — তাই এখানেই wrangler
          # আগে ইনস্টল করে নেওয়া হলো। এছাড়া Pages-এর convention অনুযায়ী Functions কনভেনশনাল
          # functions/ ফোল্ডার থেকে নেওয়া হচ্ছে; আগে dist/functions/*.test.ts ঢুকে esbuild
          # parse error দিচ্ছিল ("using fetchSpy")।
          npm install --no-save --no-audit --no-fund wrangler@4
          node scripts/build-cloudflare-functions.mjs

      - name: Deploy to Cloudflare Pages (if secrets configured)
        if: github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT || 'supremeai-studio' }}

      - name: Upload Web Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-web-bundle
          path: supremeai-web-dist.tar.gz
          if-no-files-found: error

  build-desktop-windows:
    name: '2/4 Auto-Build Desktop Installers (Windows NSIS & MSI)'
    # বাংলা মন্তব্য: ভারী Windows নেটিভ বিল্ড শুধু main/tag পুশ বা ম্যানুয়াল রিলিজে চলবে;
    # PR-এ শুধু ফাস্ট Web + VSIX + CodeQL চেক চালিয়ে ফিডব্যাক দ্রুত রাখা হয়েছে।
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js 24 (npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> src-tauri/target'

      - name: Sync Version & Build Shared App Bundle
        shell: bash
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        run: |
          set -euo pipefail
          npm ci
          npm run version:sync
          npm run build:app

      - name: Build Tauri NSIS & MSI Installers
        shell: bash
        env:
          SUPREMEAI_SUPABASE_ANON_KEY: ${{ secrets.SUPREMEAI_SUPABASE_ANON_KEY }}
        run: npm run tauri -- build --config src-tauri/tauri.conf.json

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-desktop-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  build-android-tauri-apk:
    name: '3/4 Auto-Build Tauri v2 Android APK (Same React UI + Rust Core)'
    # বাংলা মন্তব্য: ভারী Android APK নেটিভ বিল্ড শুধু main/tag পুশ বা ম্যানুয়াল রিলিজে চলবে।
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js 24 (npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup JDK 21 (Required by Tauri v2 Gradle 9 + AGP 9)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Pre-installed Android SDK, Licenses & NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK_DIR" ]; then
            echo "::error::Android SDK directory not found at $SDK_DIR"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"

          if [ -d "$SDK_DIR/cmdline-tools/latest/bin" ]; then
            echo "$SDK_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          fi

          if [ -n "${SDKMANAGER:-}" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            if [ ! -d "$SDK_DIR/platforms/android-37" ]; then
              "$SDKMANAGER" "platforms;android-37" || true
            fi
          fi

          NDK_DIR=$(ls -d "$SDK_DIR/ndk/"* 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$NDK_DIR" ]; then
            if [ -n "${SDKMANAGER:-}" ]; then
              "$SDKMANAGER" "ndk;27.0.12077973"
              NDK_DIR="$SDK_DIR/ndk/27.0.12077973"
            else
              echo "::error::Android NDK not found and sdkmanager unavailable"
              exit 1
            fi
          fi

          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "Using Java: $(java -version 2>&1 | head -n 1)"
          echo "Using Android SDK: $SDK_DIR"
          echo "Using Android NDK: $NDK_DIR"

      - name: Setup Rust toolchain (Android arm64-v8a)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> src-tauri/target'

      - name: Sync Version & Build Shared App Bundle
        shell: bash
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        run: |
          set -euo pipefail
          npm ci
          npm run version:sync
          npm run build:app

      - name: Initialize & Build Tauri v2 Android Release APK
        shell: bash
        env:
          SUPREMEAI_SUPABASE_ANON_KEY: ${{ secrets.SUPREMEAI_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ ! -d "src-tauri/gen/android" ]; then
            npm run tauri -- android init --ci --skip-targets-install
          fi
          chmod +x src-tauri/gen/android/gradlew 2>/dev/null || true
          # বাংলা মন্তব্য: শুধু আধুনিক ৬৪-বিট (arm64-v8a) ডিভাইসের জন্য APK বিল্ড করা হচ্ছে যাতে সাইজ ও বিল্ড টাইম ~৪০% কমে।
          npm run tauri -- android build --apk --target aarch64 --ci

      - name: Sign Android APK (v2/v3 apksigner for Android 11-15+)
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p release-apks
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$BUILD_TOOLS" ] || [ ! -x "$BUILD_TOOLS/apksigner" ]; then
            echo "::error::Android build-tools with apksigner not found in $ANDROID_HOME/build-tools"
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/supremeai-release.keystore"
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "::warning::Android release signing secrets not set — generating ephemeral keystore for direct APK release."
            KS_PASS="supremeai-ephemeral-pass"
            KEY_ALIAS="supremeai"
            KEY_PASS="supremeai-ephemeral-pass"
            keytool -genkeypair -v -keystore "$KEYSTORE_PATH" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KEY_PASS" \
              -dname "CN=SupremeAI, OU=Mobile, O=SupremeAI, L=Dhaka, S=Dhaka, C=BD"
          else
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            KS_PASS="${ANDROID_KEYSTORE_PASSWORD}"
            KEY_ALIAS="${ANDROID_KEY_ALIAS}"
            KEY_PASS="${ANDROID_KEY_PASSWORD}"
          fi

          while IFS= read -r apk; do
            [ -z "$apk" ] && continue
            BASENAME=$(basename "$apk" .apk)
            ALIGNED="$RUNNER_TEMP/${BASENAME}-aligned.apk"
            SIGNED="release-apks/SupremeAI-Studio-${BASENAME%-unsigned}.apk"
            "$BUILD_TOOLS/zipalign" -f -p 4 "$apk" "$ALIGNED"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$KEYSTORE_PATH" \
              --ks-pass "pass:$KS_PASS" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "pass:$KEY_PASS" \
              --out "$SIGNED" \
              "$ALIGNED"
          done < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk")

          APK_COUNT=$(find release-apks -type f -name "*.apk" | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::No signed APKs were generated in release-apks/"
            exit 1
          fi
          ls -lh release-apks/

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-android-apk
          path: release-apks/*.apk
          if-no-files-found: error

  build-vscode-vsix:
    name: '4/4 Auto-Build VS Code Extension (.vsix)'
    needs: [smart-pr-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js 24 (npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Sync Version, Test & Package VSIX
        shell: bash
        run: |
          set -euo pipefail
          npm run version:sync
          cd packages/vscode-extension
          npm install --no-audit --no-fund
          npm run compile
          npm test
          VER=$(node -p "require('./package.json').version")
          npx --yes @vscode/vsce package --no-git-tag-version --out "supremeai-vscode-${VER}.vsix"

      - name: Upload VS Code VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-vscode-vsix
          path: packages/vscode-extension/*.vsix
          if-no-files-found: error

  publish-unified-release:
    name: 'Publish Coordinated Release (Web + Desktop + Android + VSIX)'
    needs: [build-web, build-desktop-windows, build-android-tauri-apk, build-vscode-vsix]
    if: github.event_name == 'push' || inputs.publish_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Download All 4 Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Determine Release Tag & Prerelease Mode
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.release_version }}
          REQUESTED_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="latest"
          is_pre=true
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            is_pre=false
          elif [[ -n "$REQUESTED_TAG" ]]; then
            tag="$REQUESTED_TAG"
            is_pre="${REQUESTED_PRERELEASE:-false}"
          fi
          if [[ "$tag" != latest && "$tag" != "v$version" ]]; then
            echo "::error::Release tag must match package.json (v$version)."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "is_pre=$is_pre" >> "$GITHUB_OUTPUT"
          echo "title=SupremeAI Studio $tag (Web + Desktop + Android + VSIX)" >> "$GITHUB_OUTPUT"

      - name: Generate Unified Release Manifest (Web + Desktop + Android + VSIX)
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          WEB_STUDIO_URL: https://supremeai-studio.pages.dev
        run: node scripts/desktop-release-manifest.mjs

      - name: Publish Single Coordinated GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.title }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ steps.version.outputs.is_pre }}
          generate_release_notes: true
          make_latest: ${{ steps.version.outputs.is_pre == 'false' && 'true' || 'false' }}
          files: |
            latest-desktop.json
            latest-release.json
            release-artifacts/release-web-bundle/*.tar.gz
            release-artifacts/release-desktop-windows/**/*.exe
            release-artifacts/release-desktop-windows/**/*.msi
            release-artifacts/release-android-apk/*.apk
            release-artifacts/release-vscode-vsix/*.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-admin-redirect:
    # বাংলা মন্তব্য: আলাদা Next.js অ্যাডমিন অ্যাপ (admin/) মুছে ফেলা হয়েছে — এর API রুট আগেই
    # সরানো ছিল, তাই লাইভ supremeai-admin.pages.dev-এর সব /api/admin/* কল 404 দিত।
    # এখন supremeai-admin প্রজেক্টে শুধু ২টা স্ট্যাটিক ফাইল (_redirects + index.html) ডিপ্লয় হয়,
    # যা মূল স্টুডিওর অ্যাডমিন প্যানেলে (?tab=admin-overview) 301 redirect করে।
    # শুধু redirect ফোল্ডার বদলালে অথবা হাতে workflow_dispatch চালালে চলে।
    name: "Deploy Admin Redirect (supremeai-admin → studio)"
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect redirect changes
        id: changed
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             git diff --name-only HEAD~1 HEAD -- deploy/admin-redirect | grep -q .; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy redirect to Cloudflare Pages (supremeai-admin)
        if: steps.changed.outputs.deploy == 'true' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        shell: bash
        run: npx --yes wrangler@4 pages deploy deploy/admin-redirect --project-name=supremeai-admin --branch=main --commit-dirty=true

  pr-landing-decision:
    name: 'PR Landing Decision (Auto-Merge vs HITL)'
    if: github.event_name == 'pull_request'
    needs: [smart-pr-guard, build-web, build-vscode-vsix]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Assess Landing Eligibility
        id: assess
        shell: bash
        run: |
          RISK="${{ needs.smart-pr-guard.outputs.risk_tier }}"
          PASSED="${{ needs.smart-pr-guard.outputs.pr_guard_passed }}"
          echo "=========================================="
          echo "   SupremeAI PR Landing Assessment"
          echo "=========================================="
          echo "Preflight Guard: $PASSED"
          echo "Web Studio Build: SUCCESS"
          echo "VS Code Extension Build: SUCCESS"
          echo "Risk Classification: $RISK"
          echo "=========================================="
          # বাংলা মন্তব্য: যদি প্রিফ্লাইট গার্ড পাস হয় এবং রিস্ক টিয়ার LOW বা MEDIUM (ভেরিফায়েড কোড) হয়, তবে পিআর অটো-মার্জ হবে
          # শুধুমাত্র HIGH রিস্ক (auth, secrets, workflows) অ্যাডমিন রিভিউতে যাবে
          if [[ ("$RISK" == "LOW" || "$RISK" == "MEDIUM") && "$PASSED" == "true" ]]; then
            echo "decision=AUTO_MERGE" >> "$GITHUB_OUTPUT"
            echo "✅ $RISK RISK: PR is verified and safe for autonomous merge."
          else
            echo "decision=OWNER_REVIEW" >> "$GITHUB_OUTPUT"
            echo "⚠️ $RISK RISK: Contains critical paths. Requires Operator / Admin approval before landing."
          fi

      - name: Autonomous Squash Merge Verified PR
        if: steps.assess.outputs.decision == 'AUTO_MERGE'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_PAT || secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # বাংলা মন্তব্য: প্রিফ্লাইট ও বিল্ড ভেরিফায়েড হলে স্বয়ংক্রিয়ভাবে squash merge সম্পন্ন করো (--admin বাইপাস ফ্ল্যাগ সহ)
          echo "🚀 Executing automated squash merge for PR #$PR_NUMBER (head: $HEAD_SHA)..."
          gh pr review "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --approve -b "✅ Autonomous PR Guard verified: Risk Tier $RISK, Web & VSIX Build SUCCESS." 2>/dev/null || true
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --match-head-commit "$HEAD_SHA" --admin

  sync-cross-repo-patches:
    name: 'Sync cross-repo patches to supremeai (Auto-PR)'
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Apply patches to supremeai
        if: env.GH_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_PAT || secrets.ORGANIZATION_SYNC_TOKEN }}
        run: |
          # বাংলা মন্তব্য: শুধুমাত্র .patches/private ডিরেক্টরিতে .patch/.diff ফাইল থাকলেই এক্সিকিউট হবে
          PATCH_COUNT=$(find .patches/private -maxdepth 1 -name '*.patch' -o -name '*.diff' 2>/dev/null | wc -l)
          if [ "$PATCH_COUNT" -gt 0 ]; then
            echo "Found $PATCH_COUNT patch file(s) in .patches/private. Syncing to supremeai..."
            git clone "https://x-access-token:${GH_TOKEN}@github.com/Supremeai-bd/supremeai.git" ../supremeai
            python scripts/ci/apply_cross_repo_patch.py \
              --patch-dir .patches/private \
              --target-dir ../supremeai \
              --target-repo Supremeai-bd/supremeai \
              --source-repo Supremeai-bd/supremeai-public \
              --apply --create-pr
          else
            echo "::notice title=Cross-Repo Sync::No cross-repo patches (*.patch, *.diff) in .patches/private; clean state."
          fi

  hardening-patch-check:
    name: Hardening Patch Apply Check (B8)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Check hardening/backend/*.patch apply cleanly
        run: |
          for p in hardening/backend/*.patch; do
            echo "Checking $p..."
            git apply --check "$p" || echo "::warning::Patch drift detected in $p"
          done

  server-budget-report:
    name: Server Budget Report (A6)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Report server.ts line count and router count
        run: |
          LINES=$(wc -l < server.ts)
          ROUTERS=$(ls -1 src/server/routes/*.ts 2>/dev/null | wc -l)
          echo "### Server Budget Report (A6)" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`server.ts\` lines: **$LINES**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Registered route modules (\`src/server/routes/*.ts\`): **$ROUTERS**" >> "$GITHUB_STEP_SUMMARY"
