[package]
name = "supremeai-desktop"
version = "2.5.0"
edition = "2021"
build = "build.rs"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
base64 = "0.22"
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.10"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "supremeai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "supremeai-desktop"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true
